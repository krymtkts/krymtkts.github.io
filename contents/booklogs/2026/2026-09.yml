- date: 2026-09-01
  bookTitle: 記号と再帰 新装版 記号論の形式・プログラムの必然
  pages: 227 ~ 261
  notes: |
    第 12 章 ~ 本書の終わりまで。記号における再帰とは何か。記号が投機的媒体である点は、自然言語とプログラミング言語も同じ。
    これらは記号としてはほぼ同様の性質を持つが、再帰性が、計算機が再帰を扱う際の制約によって違いを生む一端となっていた。
    本書はコレで終わり。壮大な本だった。全部は取れなかったが、かなり面白かった。
    計算機科学寄りの章は比較的理解できたが、哲学的な章はかなり難しかった。両方の分野を取りこぼさず読むには力量が足りなかったな。
    著者の他の本も読みたいが、いったんは難しい本を連続せず、少し間を置いてから挑戦しようと思う。
- date: 2026-09-02
  bookTitle: メディチ・インパクト
  pages: 1 ~ 16
  notes: |
    はじめに。異なる分野・学問・文化が交差するときに生まれる創造性、その交差点がどのように生まれ、どのようにすれば得られるか。
    交差点の例として、ミック・ピアースが自然の生態系にヒントを得たイーストゲート・センター、ジョージ・ソロスのオープン・ソサエティ等。
    ミック・ピアースのはバイオミメティクス(生物模倣)と呼ばれるらしい。
    人に勧められて昔いた会社の補助で買って以降積んでたので読み始めた。
    全く異なる分野の交差がイノベーティブなアイデアにつながる、ってのが本書の主張ぽい。
    個人的な感覚では、そもそも抽象度を高めたら分野が違っても似てる点を見つけるのは難しくなく(所謂パターン)、むしろ全く異なることの方が少なかったりするので、どんな話が展開されるのか興味ある。
- date: 2026-09-03
  bookTitle: メディチ・インパクト
  pages: 17 ~ 31
  notes: |
    第 1 章。テリーザ・アマビルの定義では、クリエイティブなアイデアとはその分野にとって新しいもので価値があるもの、イノベーティブなアイデアとは実現されるものであること。またそれらは社会的に評価されて初めて見極められる。
    本書でいう分野とは知識や実践といった概念で構成される。革新的なアイデアを次々と生み出す交差点とは、複数の分野に属する概念が互いに結びつけられる場。
    1 つの分野から生み出される方向的アイデア。交差点から生み出される交差的アイデア。
    方向的イノベーションは予測可能な短期的な成果につながり、交差的イノベーションは新しい世界を切り開く成果を生む。
    異なる分野の知識をかけ合わせることで革新的なアイデアを生む、というのはわかるけど、ちょっと単分野を下げて交差点で他の分野と交流して新しい概念に触れることを持ち上げ過ぎてるようにも読めた。
    交差点が機能するには、まず自分の知識が内的に何らかの形でモデル化がされている必要があると思うけど、本文中では触れられてなさそう。そんなの当たり前に勉強してるでしょって前提なのかな。
    個人的には交差点を否定するつもりはなく、探索空間を拡大する術として複数の分野を導入する、というのなら話はわかる。
- date: 2026-09-04
  bookTitle: メディチ・インパクト
  pages: 32 ~ 48
  notes: |
    第 2 章。現代はグローバリゼーション、異なる科学分野の融合、コンピュータ技術の飛躍的向上といった 3 つの要素が交差点の増加を加速している。
    経済活動・戦争・移民が人が既に住んでいる場所への人の移動を促した。
    成熟した科学分野では分野内だけで新しい知見を得る余地が相対的に狭まり、異分野間の相互作用が新しい知見や技術の源泉になった。
    コンピュータ技術の進化で労働集約的作業から解放されそれまでと違うことができるようになった。またインターネットがコミュニケーションを容易にした。
    この章では、交差点で生まれた事例を多く例示して説明しており、読者は具体的なイメージを持ちやすいが、メモ的には事例全部書ききれずざっくり重要な点だけ押さえる内容って感じ。
- date: 2026-09-05
  bookTitle: メディチ・インパクト
  pages: 49 ~ 61
  notes: |
    第 3 章。連想のバリアを低くすることが交差点へつながる。例としてアクアビットのマーカス・サミュエルソンの独創的なスウェーデン料理の開発。
    連想の連鎖は、つまるところファストアンドスローで言われるようなヒューリスティクスの話題で、びっくりした。ここでつながるとは思わなかった。
    発散的思考も運動能で見たし、クリエイティブプログラマーの話ともつながる。
    大して面白くない本かもなと思ったけど、予想外のつながりがあってハッとさせられた。
    効率化のための探索空間の枝刈りを弱め、広い探索空間の可能性を残すのが、連想のバリアを下げることと読めた。
    出版当時既に蓄積していた認知心理学的な知見を、異分野の交差というイノベーション論へまとめ直して一般化した本なのかも。
- date: 2026-09-06
  bookTitle: メディチ・インパクト
  pages: 62 ~ 83
  notes: |
    第 4 章。連想のバリアを壊す。
    様々な文化に触れ、経験を昇華する十分な時間があれば、一つの観点に基づいて考えるのにこだわらなくなる。
    例えば複数の分野を独学するような既成の教育にない学び方が、従来考えられなかった考えに辿りつくことがある。ただし学びを深めるほど既成の問題設定や解法も身につき、かえってアイデアが浮かびにくくなる。
    思い込みの逆転。秘密鍵を事前共有しない RSA 公開鍵暗号。
    違う視点に立つ。実際とは違う状況を想像する。制約を設けてみる。
    既成の教育の件は、専門知識はアイデアの材料を増やす一方で、既存の問題設定や解法への連想も強めるので、深さと連想のバリアにはトレードオフがあるんやろな。だから 1 つの分野に留まらず複数の分野を学ぶことで既成概念に留まらずに済むのかも。
    思い込みの逆転とか違う視点に立つことは、仮説を置いた演繹や背理法のような論理的思考に通じるものを感じる。
- date: 2026-09-07
  bookTitle: メディチ・インパクト
  pages: 84 ~ 101
  notes: |
    第 5 章。リチャード・ガーフィールドのマジック：ザ・ギャザリングのエピソード。コレクションとゲーム、異なる概念の偶発的な交差。
    異なる概念のぶつかり合いが創造的アイデアにつながることに最初に触れたのは、アーサー・ケストラーの「創造活動の理論」(邦訳ではラティス)。
    ジョークで予期せぬ概念が割り込んでくるのと新しい洞察を得るプロセスがにている点に触れる。
    まず最初に集中的に問題に取り組んだあと準備の期間を経て現れる「空を光る閃光のような発見」と、準備をすることで本来なら容易に見逃してしまうような「心の準備のあるところに訪れる発見」。
    その偶発的なチャンスを増やすことが可能かについては次章で触れるようだが、努力と関係するっぽい。
    後者については Luck is what happens when preparation meets opportunity の話だという認識。
- date: 2026-09-08
  bookTitle: メディチ・インパクト
  pages: 102 ~ 121
  notes: |
    第 6 章。連想のバリアを破壊するチャンスを増やす。
    職の多様化、ベイン&カンパニーのオリット・ガディッシュを例に、多様な職の背景やビジネス以外の分野からも新しいアイデアを持ち込めることを示す。
    多様な構成のグループ、自分と異質な人との交流はアイデアを生むが、多くの人は多様な構成のチームで働くことにためらいを感じる。シミラー・アトラクション。異なる意見への反発を個人的なものにしないオープンな環境を管理する必要もある。
    交差点ハンティング。意図的に異なる全く関係ない物事を組み合わせて、偶発性に頼らずアイデアを得る。マイケル・ミハルコのいう思考の散歩。
    職やチームの多様性は、職能横断的なチームで人の間に交差点をつくり、ジョブローテーションで人の中に交差点をつくる、というプラクティスと読み解けるか。
    思考の散歩に関しては、意図的に関係ないものを結びつける思考実験の効果に触れられているが、歩くこと自体が創造性に繋がる話とも関連があると考えるのが自然かな。
    20年以上前の本なのもあってか驚くようなことは書いてないが、他の本で読んだ内容とはつながる。
    次章からメディチ・エフェクトと著者が名付けた爆発的なイノベーションを生むメカニズムのキーに迫るらしい。
- date: 2026-09-09
  bookTitle: メディチ・インパクト
  pages: 122 ~ 141
  notes: |
    第 7 章。ディーン・サイモントンは、イノベーターは成功したから多くを生み出すのでなく、多くを生み出すから成功したのだと説明する。
    例として STDMA(Self-organized time-division multiple access 、本書では自律同期型 TDM) を開発したホーカン・ランスをはじめとする多作な著名人。イノベーションは偶発的なものであるため、大量のアイデアの中から望ましいものに当たる可能性を高められる。多作な人ほど傑作の絶対数も増える傾向がある。
    大量のアイデアを生み出すことができるのが、交差点。異分野のかけ合わせが組合せ爆発的にアイデアを生み出し、それがメディチ・エフェクトの核心。
    単に数撃ちゃ当たるじゃなくて望みのありそうな候補をいくつも試すことが創造的なアイデアの実現に必要なんやろな。
    数多く候補を生み、試行錯誤から有望なものを残していく点は、アジャイルやデザイン思考にも通ずるのかな。
- date: 2026-09-10
  bookTitle: メディチ・インパクト
  pages: 142 ~ 161
  notes: |
    第 8 章。実際にアイデアを掴み取る方法。
    深さと広さのバランスをとる。広く浅く複数の分野を知っていても膨大な組み合わせからアイデアを生み出すのは難しい。実際には中核となる専門知識を持つことがその手助けとなる可能性が高い。
    積極的に多くのアイデアを出す。ブレインストーミングが役に立つが、複数人の動機コミュニケーションの難しさや、ただ乗り効果・評価懸念により期待以上の効果が出ないこともある。
    参加者が個々に考える時間を事前に取る、全員がグループに積極的に参加する必要がある。ブレインライティングという手法も使える。
    評価には十分時間をかける。時間的なプレッシャーは短期的に効果があることがあっても長期的には何の意味もない。
    閃きの決定的な瞬間までじっくり考え続ける必要があり、そのためには浮かんだアイデアを記録して振り返れる必要がある。
    次章から手にした有望なアイデアを形にする方法に触れる。
    時間のプレッシャーの話はマネジメント本や創造性の本で散々見たの、で探索的な思考全般にに関わる共通点なわけか。
    第 1 章で感じた単分野を下げてたような話しぶりは本章では打って変わって重要な核であるのが明示されて、それみたことかという感じ。
- date: 2026-09-11
  bookTitle: メディチ・インパクト
  pages: 162 ~ 174
  notes: |
    第 9 章。失敗を乗り越えて実行する。
    デボラ・プロスロースティスと暴力防止プログラム。
    交差点で爆発的に生まれるアイデアは副産物として多量の失敗も生む。
    よって何がうまくいくか 1 つずつ検証するような、失敗も考慮した計画を立てるしかない。交差点ではそれが当たり前。
    タイトルがあまり良くなくて、成功するまで試行錯誤って話と思った。話の内容自体は現代からすれば至極当然で納得感がある。
    失敗を克服するというより、失敗を探索コストとして最初から計画に織り込む話と読めた。
    また、ここのエピソードは創造性とは別にそれ自体興味深く、それだけの本でガッツリ読みたいなと興味をそそられた。
