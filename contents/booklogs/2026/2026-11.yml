- date: 2026-11-20
  bookTitle: ハーバードの個性学入門 平均思考は捨てなさい
  pages: 1 ~ 32
  notes: |
    明日から旅行のため、途中で読み終わってしまうワインの基礎知識に代わって読み始めた。帰宅後に続きを読む予定。
    はじめに。平均的な人間など存在しない。ギルバート・ダニエルズの航空医学研究所でのパイロットの体型の測定結果。ロバート・L・ディキンソン博士の「ノーマ」の体型を探すコンテスト。いずれも平均的な体型は存在しないことを示していた。
    アメリカ空軍はジェット機のコックピットの設計において、ダニエルズの研究から「平均的」な体型に合わせるのでなく、現代では「ふつう」な調整可能な機能・装備に変更した。
    平均は集団を比較する際には役に立つが、個人に対しては役に立たない。体型だけでなく才能・知性・性格も同様。
    本書は、バラツキの原理、コンテキストの原理、迂回路の原理といった個性に関する 3 つの原理を紹介する。これらの平均から個性への移行は、病気の原因がミアズマから細菌へと変わった医学の歴史のように、一般のヒトに自分を左右する力を与えるものである。
    未だ平均を対象にした設計というのはよく見られる。古いと思う反面、採用やチームだと足切りや制御可能性から外れ値を除外しないと予測可能な設計ができないのでわからなくはない。
    でもわたし自身がピーキーで平均に合わせられない。現在も個の力を最大限発揮することが最も組織に価値を提供できている。
    ファスト＆スローでもよく取り上げられる平均への回帰といった統計的現象もあるし、このテーマはとても興味深い。
    著者自身も外れ値のようなので、生存者バイアスも考慮して読む必要があると感じた。
- date: 2026-11-21
  bookTitle: ハーバードの個性学入門 平均思考は捨てなさい
  pages: 32 ~ 61
  notes: |
    第 1 章。平均の利用に関する誤った認識。ケトレーの平均人。ゴルトンの無能者・有能者。
    ケトレーは平均をあるべき姿とし、ゴルトンは平均からの距離でタイプ分けし有能無能のランクを見出した。
    個人差を軽視した考えには当時から批判もあったが、現代の平均主義的な考えにつながった。
    平均は集団の傾向・比較や統計的な予測に有用だが、平均を個人の理想像や標準とみなし、個人の評価や制度設計に一律に適用することには問題があるってことじゃないかな。
    ひとまず、平均からの偏差そのものを優劣と結びつけること、複数の特性の平均を組み合わせたモデルが多くの個人を代表できると考えることに問題があると理解した。
    これは統計学で以前から知られている平均の誤用とも重なると思う。
    本書は平均主義を批判してるのに、邦訳タイトルでは「ハーバード流」というランク付けをしてるのは、残念な感じがするな。内容と合ってない気がする。
- date: 2026-11-22
  bookTitle: ハーバードの個性学入門 平均思考は捨てなさい
  pages: 62 ~ 88
  notes: |
    第 2 章。フレデリック・ウィンスロー・テイラーによる科学的管理法。作業の分析・標準化と管理による効率化、平均主義との関連。
    労働の肉体と頭脳が分離され、管理職やコンサルタントの専門化が進んだ。
    テイラー主義を前提にした教育ビジョンにより教育改革。標準化された教育と、エドワード・ソーンダイクによる能力に基づく優等生・劣等生の区別。
    平均を重視するシステムは民主主義の繁栄に大きく貢献したが、その反面個人の尊厳は蔑ろにされた。
    テイラーって TEAM OF TEAMS でも出てきてたな。要素還元主義的な標準化が環境の変化への柔軟な適応を失う点を指摘していたのに対し、本書は個人に組織への適用を強制し、能力の発揮を制約する点を指摘してる。
    思うに標準化自体は悪くなく、効率性や予測可能性を確保するうえで合理的な手段だが、標準化が個人やチームの裁量を制約し、適用条件が変化しても同じ標準に固執することが、環境への適応も阻害するんやろな。
    TEAM OF TEAMS では急激な変化に適応するための組織の形が示されがけど、個人の可能性を殺さず活かす点を本書で紹介してくれるんやろな。そうじゃないとただ文句を言って終わりの本になってしまう。
