    個性を重視する学問では個人の分析を優先し、統計手法のような静的な数学的手法でなく、個人内の非線形な変化を捉える力学系数学といった動的な手法を利用する。
    平均主義では集計してから分析する。個性学では個人ごとに分析してから集計する。
