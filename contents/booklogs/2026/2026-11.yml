    JIA 等の設備工事標準仕様書で不十分な理想の厨房を実現するための個別の厨房工事の情報を特記仕様書にまとめる。
    厨房設備のステンレス鋼種は耐酸性・耐食性・耐熱性・耐低温性・加工性・強度に優れた SUS-304 が特に指示がなければ利用されるが、実際には耐食性・耐酸性に劣る SUS-430 を使用することも多い。
    施工段階でも設計者は運営者とのすり合わせ、 板金工場・厨房メーカーとの中間検査、引渡前の取扱説明会、運用後の衛生管理や省力化など合理化のチェックといったフィードバックが必要となる。
    設備工事もフィードバックを受けて調整って流れなんやな。設計した厨房が意図した通り機能することまで確認するのが設計者の役割か。
