- date: 2026-11-26
  bookTitle: ハーバードの個性学入門 平均思考は捨てなさい
  pages: 111 ~ 141
  notes: |
    第 4 章。バラツキの原理。グーグル・デロイト・マイクロソフトが個人を点数でランク付けする制度を導入し、その後その一次元的な人材評価やランク付けを見直した事例。
    ランク付けが上手くいかない理由は、才能には多面的で相関の低いバラツキがあるにもかかわらず、一次元の尺度で評価しようとしたため。
    一次元的思考に陥ってしまうのは、企業や学校等の社会的機関が単一の基準による比較を推奨し続け、平均主義への偏重が強まった結果。
    自分自身の才能を正しく知るためには、才能を評価する方法を考えるよりも、まず一次元的思考を放棄しなければならない。
    個人に注目せず集団の効率を優先するのであれば平均主義的なアプローチは「平均的」に機能する、って言及されてるの面白い。以前から気になってた点だ。
    個人の才能を見出すには、目的に応じて能力の複数の側面を考慮・評価する必要があって、単一の尺度による評価よりコストが高く付く。それを受け入れてでも才能を発掘する価値があるか、というコスパの話なんやろなあ。なるほどね。
