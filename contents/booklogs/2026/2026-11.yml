    個人を優先するアプローチでは個人ごとに多くのデータが必要になるが、現代では技術の進歩によって大量の個人データを取得しやすくなった。不足するのはそれを活用する心構え。
    これで第 1 部が終わってこっから個人優先の具体的な手法に踏み込んでいく感じか。力学系数学ってのは聞いたことがなかったから調べとこ。
