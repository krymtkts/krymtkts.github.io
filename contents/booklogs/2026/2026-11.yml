- date: 2026-11-01
  bookTitle: 新版 これだけは知っておきたい 厨房設計の知識
  pages: 152 ~ 162
  notes: |
    4 。厨房で発生する臭気・排水・ゴミの処理。臭気の発生源・環境問題でもあるゴミの処分は真摯に取り組む必要がある。
    厨芥処理設備は従来圧縮減容設備が使われてきたが、ごみの分別の進みもあり水分・油分を染み込ませていた紙ゴミが減り、単独で処理する方式に移行するケースが増えている。
    生物処理方式は微生物の安全性に課題はあるが、最終生成物であるコンポストやメタンガスの利用が可能である。
    水道水は安全基準はクリアしているが、調理に使用する水としては不十分であり、浄化・軟化・電解されて使用される。
    厨房除害装置は、下水道法等の規制により一定条件を超える厨房排水量で油脂分の指標値であるノルマルヘキサン値を抑えるために設置される。前の章ででたグリストラップ等。
    厨房排気の開放場所に関しても、悪臭防止法や自治体の条例で定められた臭気濃度を守る必要がある。また外気取り込み口へのショートサーキットに注意する。
    デジタルしかやってない身からしたら実感湧きにくいが、廃棄物の処理は食品を取り扱うなら避けて通れん課題なので興味深いな。
    厨房設計というか建設がそうなのかも知れんが、要求仕様だけでなく守らないといけない法令規則が多くて、制約の中で最適解を見つけるは難しそうやな。
- date: 2026-11-02
  bookTitle: 新版 これだけは知っておきたい 厨房設計の知識
  pages: 163 ~ 182
  notes: |
    4 。安全対策・作図・特記仕様・コストコントロール・運用フォロー・メンテナンス。
    排気に含まれる油脂分。ダクトが閉塞して不完全燃焼し一酸化炭素中毒や引火の恐れがあり、火炎伝送防止装置の設置が定められている。
    JIA 等の設備工事標準仕様書で不十分な理想の厨房を実現するための個別の厨房工事の情報を特記仕様書にまとめる。
    厨房設備のステンレス鋼種は耐酸性・耐食性・耐熱性・耐低温性・加工性・強度に優れた SUS-304 が特に指示がなければ利用されるが、実際には耐食性・耐酸性に劣る SUS-430 を使用することも多い。
    施工段階でも設計者は運営者とのすり合わせ、 板金工場・厨房メーカーとの中間検査、引渡前の取扱説明会、運用後の衛生管理や省力化など合理化のチェックといったフィードバックが必要となる。
    設備工事もフィードバックを受けて調整って流れなんやな。設計した厨房が意図した通り機能することまで確認するのが設計者の役割か。
- date: 2026-11-03
  bookTitle: 新版 これだけは知っておきたい 厨房設計の知識
  pages: 183 ~ 202
  notes: |
    5 。厨房設計の事例。社員食堂の事例として鹿島赤坂別館、病院厨房の事例としてがん研究会有明病院の紹介。
    いずれも全電化・ガス中心のようなコンセプトがあったうえで、省エネや運用コスト低減による経済性・厨房の快適性・ HACCP 導入による衛生性の向上が図られている。
    本書はこれで終わり。本書は厨房設計の具体的な改善手法を紹介する実務書だが、課題や制約に応じた設計上の定石には、パターンとして捉えられるものがあるんやなと感じた。
    ある意味鹿島出版会らしいのかな？同出版社の本をそんな何冊も読んだわけじゃないので当てずっぽうだが。
    ソフトウェア開発と違って難しそうだと感じたのは、パターン自体の導入コスト自体も安くない(HACCP や、板金のオーダーメイド)点かな。
    ソフトウェア開発は物理的な設備の制約がない分、設計を変更する自由度が高いんやなという実感を得た。
- date: 2026-11-04
  bookTitle: 発酵はおいしい！ イラストで読む世界の発酵食品
  pages: 1 ~ 11
  notes: |
    9 月 10 月で燃え尽き気味なので、前にも読んだ本を軽く読み返す感じで。発酵の本読むとちょっと安らぐ。
    1 世界の発酵食品。
    美味・保存性・健康など人間に有益な微生物の活動≒発酵。カビ・酵母・乳酸菌が発酵微生物の御三家。
    キビヤックや納豆のように文化によって発酵と腐敗の境界が曖昧であることがある。野生の微生物と人間が管理する違い。
    著者陣はサンダー・キャッツ氏との関連もあり、発酵食品の魅力をイラストを交えてわかりやすく解説している。
    人が管理すると使いやすくはなれどそれでも微生物の活動を完全に制御することは難しいってのが、楽しいところ。
- date: 2026-11-05
  bookTitle: 発酵はおいしい！ イラストで読む世界の発酵食品
  pages: 12 ~ 29
  notes: |
    パン。パンの狭義(ドウ(dough)を発酵で膨らませて焼く)と広義(穀類の粉に水・乳・果汁などの水分を加え焼く・蒸す・揚げる・茹でる。発酵の有無は関係ない)。
    ビールとパンは共にサッカロマイセス・セレビシエ(Saccharomyces cerevisiae)で発酵する。
    サワードウのパン種は、乳酸菌が酸を、酵母がアルコールと炭酸ガスを発することで他の菌の増殖が抑制される。
    発酵乳。代表的な乳酸菌、ラクトバチルス菌属・乳酸球菌属・ロイコノストック菌属・ビフィズス菌属。
    発酵以外の情報も多いから発酵に注目してメモった。サワー種好きだわ。インジェラ食べたことないから食べたいのよね。
    カビの生えたヴィーリも食べてみたいが、市販のヴィーリの菌だと生えない。ただ日本の常温で発酵できるので重宝してる。
    パン・ヨーグルト・チーズの節でも書かれてたけど土地ごとの様々な微生物の関わりでバリエーションが生まれるの、いいよな。
