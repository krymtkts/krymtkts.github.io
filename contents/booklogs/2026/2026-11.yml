    魚醤・魚醤油。タンパク質分解酵素と微生物の働きで自然発酵してできる。中国から伝わった説と日本で自然発生した説がある。
    塩麹。甘酒。
    あまり紹介されてる食品の発酵がどうこうって話ではないのでざっくり読んだ。
