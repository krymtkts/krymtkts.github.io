- date: 2026-11-01
  bookTitle: 新版 これだけは知っておきたい 厨房設計の知識
  pages: 152 ~ 162
  notes: |
    4 。厨房で発生する臭気・排水・ゴミの処理。臭気の発生源・環境問題でもあるゴミの処分は真摯に取り組む必要がある。
    厨芥処理設備は従来圧縮減容設備が使われてきたが、ごみの分別の進みもあり水分・油分を染み込ませていた紙ゴミが減り、単独で処理する方式に移行するケースが増えている。
    生物処理方式は微生物の安全性に課題はあるが、最終生成物であるコンポストやメタンガスの利用が可能である。
    水道水は安全基準はクリアしているが、調理に使用する水としては不十分であり、浄化・軟化・電解されて使用される。
    厨房除害装置は、下水道法等の規制により一定条件を超える厨房排水量で油脂分の指標値であるノルマルヘキサン値を抑えるために設置される。前の章ででたグリストラップ等。
    厨房排気の開放場所に関しても、悪臭防止法や自治体の条例で定められた臭気濃度を守る必要がある。また外気取り込み口へのショートサーキットに注意する。
    デジタルしかやってない身からしたら実感湧きにくいが、廃棄物の処理は食品を取り扱うなら避けて通れん課題なので興味深いな。
    厨房設計というか建設がそうなのかも知れんが、要求仕様だけでなく守らないといけない法令規則が多くて、制約の中で最適解を見つけるは難しそうやな。
