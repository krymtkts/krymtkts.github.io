    第 6 章。イェルムスレウのグロセマティクス(glossematics = 本書では glossary(用語) + mathematics(数学))は記号を形式的に捉え、記号の関係や記号系を公理や原理により記述しようとした。
    シニフィエとシニフィアンを表現(expression)(本書の指示子)と内容(content)としてソシュールの考えとは区別した。
    直接指示記号と間接指示記号、後者は、指示子とそれが示す直接的な内容が、本来無関係な異なる内容を表す記号と結びつくことで、間接的に内容を表す。
    メタ言語記号と対象言語記号、考察対象とする言語=対象言語の記号とそれを内容とするメタ言語記号。イェルムスレウはメタ言語記号を「科学的なもの」であると説明する。
    二元論に関しては、メタ言語記号は型と値の関係に自然に適用できるが、間接指示記号については指示の曖昧性を起こすと考えられる。
    パースの普遍的範疇(universal category)では全対象(項)を 3 つに分類し、単項の一次性・他の一項を参照する二次性・他の二項を参照する三次性に分解する。パースは記号は三次性の典型であると考えた。
    記号と対象の関係で一次性の類似記号(icon)(対象の類似・性質)・二次性の指標記号(index)(対象との物理的・事実的関係、参照)・三次性の象徴記号(symbol)(概念)に分類した。
    三元論に関しては、三次性が二次や一次として用いられるような高次の記号が低次の記号として利用される退化によると考えられる。
    本書では、二元論・三元論の記号の分類を情報記号を介して対応付けると、類似記号は対象言語記号・間接指示記号、直接指示記号が指標記号、メタ言語記号が象徴記号に相当するとする。
    指標記号が間接指示記号の内容を指すべきところ直接指示記号の内容を指す、象徴記号がメタ言語記号の内容を指すべきところ対象言語記号・間接指示記号の内容を指す、といった曖昧さが生じる。
    本書では記号の分類について概観するには三元論が優れるとする。二元論では組合せができる点で柔軟な分類の枠組みを提供するように見えるが、二元論・三元論の対応を考えると三元論でも同様の説明ができるだろうということ。
    モデルのシンプルさでは二元論がよく出来てるなと思った。二元論にしろ三元論にしろモデルにハマらない例外ケースがないのか気になるところ。
