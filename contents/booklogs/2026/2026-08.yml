  notes: |
    第 8 章。ある対象が是態(そのものであることの所以、他の個物と異ならせる様態)を持つ条件について。
    プログラムのほとんどは、モデル化で得られたある集合≒クラス≒普遍の要素に対し抽象的に処理が記述され、実際の計算はクラスから生成されたインスタンス≒個物で行われる。
    この計算の工程に於いて、大まかに、モデル化が帰納・計算が演繹に対応するが、インスタンス生成はその間の何か。
    なぜある 1 つがそのインスタンスとして選ばれるのかは、帰納・演繹だけでは説明できない。その個別性を是態として問題にする。
    普遍と個物の対比はギリシャ時代のイデア論に遡り、普遍論争に引き継がれ、普遍の所在が問われた。
    この普遍に対する追求の過程で、帰納や演繹など推論の枠組みが確立され、科学的方法の基礎となった。
    個物の是態は、古くは再生産不可能な唯一性によって基礎づけられた。ベンヤミンのアウラもそのような唯一性と関係する。
    しかし技術の進歩によって時間的・空間的な希少性を普遍化することが可能になり、それらを基盤として生成される個物は技術上もはや唯一無二たり得ない。
    唯一性がなくても是態を持つということはどういうことか、それを知る手がかりはインスタンスを得るプロセスに求められるだろう。
    この章哲学側にすごく振れてる。よってここでのクラス・インスタンスは、 OOP 固有の概念というより、普遍・個物に対応する語として読んだ。難しい。
    言葉が難しいので調べながらメモってて中々読み進められない。
