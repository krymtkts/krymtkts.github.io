- date: 2026-08-17
  bookTitle: 記号と再帰 新装版 記号論の形式・プログラムの必然
  pages: i ~ vi, 1 ~ 28
  notes: |
    第 1 章。記号は意味を担う媒体である。記号はそれ自身が再帰性を持つ。自然言語など自然発生的な記号と違いプログラミング言語のような人工的な記号では再帰の有意味・無意味の境界を何処に置くかが問題となる。
    本書では記号論の観点からプログラミング言語を捉え直し、浮かび上がる本質的な性質から、一般の記号の原理・性質を論じる。ソシュールとパースに始まる人文系の記号論と形式的な計算機科学の視点の橋渡し。
    元来記号論はその人間から切り離されずにいたが、プログラミング言語は人間の脳に解釈系が外在する。よって記号論をこの様な形式言語に適用することは、記号論の形式化・基礎の確率に役立つと思われる。
    またプログラミング言語に記号論を適用することは、記号論の昔からある考え方を以て、プログラミング言語が何故必然的に現状の姿をしているかを再発見することにもつながる。
    記号論の 3 つの側面、記号とは何かという問いに対する、記号のモデルに関するもの・種類に関するもの・系に関するものの、を反映して 3 部構成。

    第 2 章。プログラミング言語の記号の整理。関数型言語とオブジェクト指向言語の例での比較。
    プログラミング言語の構成要素。型。データや関数の定義と使用の入れ子でプログラムが定義される。文と式。型とクラス。クラスの構成子と継承。
    リテラル・演算子・予約後・識別子。これらを本書における情報記号と呼ぶ。
    識別子の解釈層。ハードウェアの層ではアドレスや実際の値。プログラミング言語の層では識別子の定義と使用の層、これは多層構造でありさらには型とアドレスの層も含む。自然言語の層では人向けに書かれたコメント。
    識別子の解釈層を定義と使用に置くということは、記号の解釈を記号の系の中だけで捉える汎記号主義につながる。人の認識が記号であるという考えはパース、ソシュール、聖アウグスティヌスにも見られる。

    壮大な感じや。興味深く、初回は多めに読んでしまったけど、ページ数に対し中々重い内容なので今後はゆっくり読もう。シニフィエとか載ってるようなのでワンス・アポン・アン・アルゴリズムの後で読むにはうってつけの本やな。積んでた本同士が繋がっていくのは良いね。
- date: 2026-08-18
