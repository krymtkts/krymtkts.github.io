- date: 2026-08-03
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 51 ~ 62
  notes: |
    3 章。表現とは何であるか。記号(シーニュ)。知覚・提示されるもの(シニフィアン)と概念(シニフィエ)の関係は、記号と表現する意味の対応。
    例えば引用符の有無で表現が変わる。使用と言及の差異。シニフィエのシニフィエのように 2 つのレベルの表現を 1 つにまとめられる。
    1 つにシニフィアンが複数にシニフィエ、複数のシニフィアンが 1 つのシニフィエを指すこともある。多義語や同義語。文脈によってシニフィエが変わる。
    誤った表現が導かれることは計算の正確性に関わる問題。記号を、対象との同一性や類似性で示されるアイコン・対象と規則的なつながりを持つインデックス・言語のように約束事のみで対象とつながるシンボルの 3 種に分ける。
    この分類を使って、いかに記号の表現が変換≒計算されているかを見ることができる。
    本書の太字の使い方は不規則なのがちょっと気になる。アイコンは太字なのに他は 2 つは太字でなくて、 3 種に分けたのに 1 つ目だけ特別扱いに見える。太字に意味はありません、てか？
- date: 2026-08-04
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 63 ~ 82
  notes: |
    職場にて ~ 4 章。特定のアクセスパターンを持つ集まりデータ型という。先着順のキュー。到着の逆順に要素を処理するスタック。優先順位付きキューはスタックの last in, first out に対し highest in, firrst out 。
    セット(集合)は要素を追加・削除・参照できるデータ型で、その集合に含まれることが問題やアルゴリズムの述語に対応しており、広く利用できる。キーワードに基づき情報を探せる拡張をセットに行ったのがディクショナリ(辞書)
    パターンに最適な要素の配置をデータ構造という。リストは並んだ列のようなデータ構造。ツリー(木)は先祖・子孫のような関係のデータ構造で、要素数が変動する場合の優先順位を求めるのに向く。
    データ構造はアルゴリズムを効率的に実行するうえで重要。リストをつなぐ矢印はポインタと呼ぶ。リストの順序にはそのリスト固有の何らかの意味がる。よってある要素にアクセスするためにはその順序を辿る必要がある。このようなアルゴリズムは線形と呼ばれる。
    データ型がデータに対して何をすべきかという要求を説明し、データ構造はその要求を満たす具体的な表現を提供する。データ型をデータ構造が実装するという関係にあり、 1 つのデータ型を複数のデータ構造で実装できる。
    なんだかこれまでの章より抽象度が低く具体的で普通のデータ構造の話だった。これまでとの落差がでかい。単に知ってることだから読みやすくなっただけなのかもしれん。
- date: 2026-08-05
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 83 ~ 106
  notes: |
    遺失物取扱所 ~ 5 章。探索空間を効率良く体系化する原則、独立された領域に分割された空間に探索対象の要素を配置し、探索対象の要素をある順番で並べる。本棚、引き出し、バインダー等。
    探索空間の分割は、常に正しく探しているもの区別できる状態でなければならない。探索対象が順序付けられている速く見つけることができる。
    この点で先頭からしか走査できないリストは探索空間を狭めることができないといえる。手がかりやキーが探索空間の内側と外側を区別する。
    ディクショナリを実装するデータ構造にリストを使うより二分探索木による実装の方は対数時間で検索や更新を効率化できる。ただしそれは平衡二分探索木の場合であり、平衡でない場合はコストがかさむ。
    トライ木は単語の並びも文字も表現できる。辿った経路が最終的な経路の接頭辞になるためプレフィックス木とも呼ばれる。
    この辺も何の変哲もないデータ構造の話で特に気づきはないか。インディ・ジョーンズを本書のような視点で見たことがないのだけは新鮮だが。
- date: 2026-08-06
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 107 ~ 126
  notes: |
    準備を整える ~ 6 章。探索対象の探索前の並び替えによって実行時間が線形対数時間や 2 次の実行時間に変わる。並び替えるは実際には線形対数時間より速く並美変えられる場合があるため、効率的なアプローチとなる。
    ソートは最小の複雑性が、つまり下限ステップ数がわかっている問題。ソートアルゴリズムは分割統治アルゴリズムの例。分割して問題の複雑度を低減、部分も台を解決し、最後に統合して解を得る。
    選択ソート。最小の要素を末尾に追加するか、最大の要素を先頭に追加する並び替え。挿入ソート。挿入したい要素より小さい要素の中で一番後ろに挿入する。挿入ソートは選択ソートより遅くなることはない。違いは自身のソート済みの計算結果を再利用しているかという点。
    クイックソート。ある要素を基点に小さい要素と大きい要素にリストを分割し、小さくなったリストをソートして結合する。最善で線形対数時間、最悪で 2 次の実行時間となる。
    マージソート。 2 つの部分リスをとソートしてから並行に走査して小さい要素から結合していく。バケットソート。要素をバケットに分類し其々の中でソートして結合する。実質最適。
    カウンティングソート。リストの要素のサイズが限られていて配列のインデックスとして利用できる場合に限り使える。その場合に限ればマージソートより速い。
    ソートで事前計算することによって再利用される限り実行時間を効率化できる。逆に事前計算の労力が無駄になる可能性がある場合は遅延評価で先延ばしすることもできる。
    完全に主観だがデータ構造やアルゴリズムのある程度具体的な説明となると映画が題材であることが意味あるんかよくわからんな。とっつきやすさがあるわけでもないし。
- date: 2026-08-07
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 127 ~ 142
  notes: |
    昼食をとる ~ 7 章。組み合わせで膨大な選択肢を持ち手に負えない(イントラクタブルな)問題と近似アルゴリズム。
    指数実行時間のアルゴリズム。生成検査は解の候補の生成において組み合わせが爆発する。このような指数アルゴリズムでしか解けない問題は手に負えない(イントラクタブル)と呼ばれる。
    NP 完全問題もイントラクタブルな問題。ナップサック問題や巡回セールスマン問題は NP 完全問題の 1 つ。
    P=NP 問題。多項式時間で解けるクラス P の問題が、多項式時間で判定できるクラス NP の問題に等しいか。
    現実的に計算できない問題の非効率を近似アルゴリズムが改善する。例えば貪欲アルゴリズムは最悪でも最適解の 50% 以内に収まる。
    指数アルゴリズムの有効活用として暗号化がある。素因数分解は NP 完全問題かわかっていないが、実行時間は指数時間が最小とわかってる。問題を解く難しさで防御するのは、塀・柵・壁等と同じ原則とみなせる。
    本書はなんか厳密な話じゃなく NP 完全≒指数実行時間を要するって単純化してるっぽいな。多項式時間≒現実的に扱える計算量、指数時間≒現実的に扱えない計算量で NP 完全が代表例、ってかんじの。
    この章の内容はそのまま最適経路の本の内容とも重なるのでおさらい感ある。
