    計算機科学では特定の振る舞いをするものの種類を型と呼ぶ。型はアルゴリズムや計算の性質を述べつのに役立つ。 1 つは入力と出力、もう 1 つは型パラメータ。 1 つのパラメータで異なる型を記述できる多相をパラメータ多相と呼ぶ。
    型付け規則では前提から規則に寄って結論を導くことで型の相互作用を予測できる。最も基本的な規則は適用規則で、関数の型と引数の型から結果の型を導く。
