  pages: 29 ~ 42
  notes: |
    第 3 章。二元論と三元論。二元論は古くは聖アウグスティヌスの時代に見られ、意味からラベルを想起させると考えた。ソシュールが転回して以降は、記号はシニフィアンとシニフィエで構成され、シニフィアンは指し示すもの(ラベル相当だが後付できるものではない)・シニフィエが意味のような指し示されるものとし、ラベルが意味を規定すると考える。
    三元論は古くはギリシャ時代プラトンまで遡り、実世界の対象がイデア(本質)を連想させラベルを想起させると考えた。パースが転回して以降の三元論では、ラベル相当の表意体が、イデア相当の解釈項を媒介とし、対象を想起させると考える。
    哲学者・言語学者の間で微妙にモデルは異なるが、ノスがいうように構成要素の数だけで見れば、二元論か三元論、あるいは亜種に分類できるという。しかし二元論と三元論の対応関係はノス曰く「バビロンの混乱状態」にあり、突き詰められていない。本書でソシュールとパースのモデルをそれぞれの代表として扱うが、それは両者が現代記号学の父であることに因る。
    ノスによると、ソシュールの二元論は三元論のうち一要素を無視しているという。具体的には対象(ノスの思想では参照)を無視しているとする。
    パースの思想は、対象を概念としての直接対象と現実世界≒心の外に外在する実体としての動的対象に分ける。モデルに含まれるのは心の中にある直接対象の方。同様にソシュールも記号を心的なものと考えていたことを鑑みると、パースの直接対象とシニフィエが対応する可能性が考えられ得る。
    また解釈項はソシュールの思想においては記号過程としてモデルに含まず、モデル外にある記号同士の全体論的価値として現れる、というのが本書の仮説。このように対応付けられた二元論・三元論を情報記号を通して確認する。
    理解が追いつかなくて読める頁数少なく、実際に検証する前できょうは終わり。面白い。いい本だこれ。
- date: 2026-08-19
  bookTitle: 記号と再帰 新装版 記号論の形式・プログラムの必然
  pages: 42 ~ 55
  notes: |
    第 3 章。 2 つのパラダイムと記号モデル。プログラムの識別子はデータか関数を表現する二元的なものとデータと関数の両方を表現する三元的なものに分けられる。
    関数型プログラミング(FP)は全てが二元的識別子であり関数とデータすらも他の記号に働きかけるものと捉える。
    オブジェクト指向プログラミング(OOP)は、オブジェクトは計算対象に関連するものをひとまとめに扱い、記号とそれが表す内容、また記号に働きかける記号も加えて三元的に捉える。
    FP は名前がシニフィアン相当、内容がシニフィエ相当であると捉えられる。名前がデータや計算本体を指す。記号が使われることに関する記述は記号に付帯せず外在する。記号のモデルに外在する使用が識別子に意味を与える。
    FP をソシュールの思想における差異に沿って見ると、どう使われるかによって別の意味を持ちうることからも、有意味である。
    OOP は名前が表意体・データ構造(クラス)が概念を表す直接対象・関数(メソッド)が解釈項に相当すると捉えられる。
    三元的識別子では識別子に意味を与えうるものは全て定義に含もうとするため、クラスの中に差異が現れる。そのため複数の識別子が関わる関数がある場合は全てを定義に含むことができないため、全てを三元的に記述できるわけでない。よって OOP には二元的・三元的識別子が混在する。
    このように一方のモデルに現れるものはもう一方のモデルにも現れ、形式的に互換であるといえることがプログラム上の対応においては正当性がある。
    以降、本書の新仮説に基づく議論をする際は、シニフィアン・表意体に相当する指示子、シニフィエ・直接対象に相当する内容、全体論的価値・解釈項に相当する使用、という語を使う。
    これまでの内容を踏まえて記号の構成要素を整理すると、内容(what 意味論的なもの)と使用(how 実用的なもの)があり、記号とは semantics と pragmatics を表象する媒体であると言える。
    なんとか 3 章読み切った。理解に頭を使うが楽しめてる気がする。最後の絵画の記号論的な解釈から次章へつなぐのもいいな。各章の主題の位置づけの地図もいい。
- date: 2026-08-20
  bookTitle: 記号と再帰 新装版 記号論の形式・プログラムの必然
  pages: 55 ~ 64
  notes: |
    第 4 章。画家による主題の解釈が表現される絵画のように、指示子・内容・使用が溶け合う契機を通して各構成要素の役割を考察する。
    まずは構成要素が少ないソシュールの二元論。ソシュールはシニフィアンとシニフィエは不可分であるとするが、その関係は恣意的であり必然性はないとする。
    情報記号では識別子は何でも良いという点において恣意的であるが、自然言語では社会的慣習により束縛されてもいるという一見矛盾した性質を持つ。
    また恣意性にも絶対的・相対的な恣意性がある。さらには記号には関係性が織りなす差異しかないとする。ソシュール自身これらを逆説的であると観察する。
    その逆説の解消を、社会的慣習に束縛されない情報記号において、構成要素がどのような場合に一体化するのか考えることで試みる(これはプログラム・ハードウェアに解釈層を置いた場合の話であり自然言語に於いては束縛される)。
    記号の最も原初的な単位の関係を考えるにあたり、情報記号も最も原初的なラムダ計算で考える。
    ラムダ計算のβ簡約は記号の置換であって、自然言語にも意味解釈を置換として捉えられる側面がある。これはラムダ計算が記号の原理を備えているからではないかという仮説。
    きっとこの先、置換から自己言及・再帰に繋がってくんやろな。ワンス・アポン・アン・アルゴリズムで置換がでてきて良かった。
    中々頁数を読むのが難しいが少しずつ進もう。
- date: 2026-08-21
  bookTitle: 記号と再帰 新装版 記号論の形式・プログラムの必然
  pages: 64 ~ 82
  notes: |
    第 4 章。どんな記号モデルでも記号の構成要素に分節と名前付与の機能が考えられている。
    分節とは記号の単位を構成する≒意味を切り出すこと。ラムダ項は複数の記号の複合体として 1 つの単位でまとめることから、分節を担う単位であるといえる。
    ソシュールの転回以前は、記号は実世界のもの(シニフィエ相当)に対するラベル(シニフィアン相当)であり機能は名前付与だけだった。ソシュールはシニフィアンに名前付与と分節の機能を持たせ、シニフィアンがシニフィエを分節する。
    ラムダ項も名前付与と分節の機能を持つが、ラムダ項における名前付与は別の分節に行われるという違いがある(ソシュールの名前付与は分節する内容自身に行う)。
    ソシュールは記号同士の関わりを差異・連辞(syntagm)として間接的に言及しているが、ラムダ項のβ簡約のような 2 つの記号を関連付けるための名前という観点は、二元論に基づく現代の記号モデルに於いても直接的に言及されない。
    ラムダ項の名前は常に局所的で動的。二元論では大域的で静的で、有効範囲は関係のある人々や言語の異なり等で実際には存在するが、記号論の枠組みの中で意識されているとは言い難い。
    ある分節が別の記号の複合から得られることは、記号の解釈をその記号系の中で考える汎記号主義の立場に相当する。
    再帰的定義には、内容が定まるより先に記号が投機的に導入されなければならない。確定する前の自身を投機的に記号で表し、自身に言及(使用)することで自身の意味を分節することが再帰。
    ソシュールが逆説的と言及したシニフィアンとシニフィエが不可分であるという性質は、再帰で顕著に成り立つ。また自然言語の多くは再帰的。
    再帰的定義を導入せずとも不動点関数による自己適用としての再帰性は内在する。これは型なしラムダ計算の場合に限り、単純型付きラムダ計算では再帰的定義や型付きの場合の拡張が必要(のちの章で触れる)。
    ラムダ項を並置した場合、二元論では第 1 のラムダ項の指示子と第 2 のラムダ項をあわせて記号の単位と見、三元論では第 1 第 2 のラムダ項をあわせて記号の単位と見る。
    この 2 つは別のモデルであるが、再帰的な記号では使用と内容が不可分になり、二元論と三元論は等価なモデル。
    再帰的な記号で使用が内容と融合するのはハーダーの意味論と実用論との関係を暗示する。使用が意味へと凝固する契機の 1 つは再帰であるというのが本書の 1 つの帰結。
    ソシュールの「記号には差異しかない」という思想は、ラムダ項の意味的な同一性を一般には判定できないという性質にも対応して現れる。
    プログラムが同一でないことを知る間接的な手法として、プログラムの入出力の差異を見ることができるが、これはソシュールの言明の 1 つの具現化のよう。
    内容が濃くてめちゃ長メモになった。うまく理解できればもっと短くまとめられるんやろが、今はこれが精一杯。
- date: 2026-08-22
  bookTitle: 記号と再帰 新装版 記号論の形式・プログラムの必然
  pages: 83 ~ 106
  notes: |
    第 5 章。情報記号の何(what)「である」どう(how)「する」の記述に基づく関係構造について。
    純粋に記号だけからなる汎記号主義的な情報記号の世界でも「である」「する」の対比があるのであれば、その本質は記号が備えているのではないかという仮説。
    OOP では、対象のデータ構造に注目して記述すると「である」に基づく関係、関数に注目して記述すると「する」に基づく関係を構成する。
    OOP の「である」に相当するのはクラス、「する」に相当するのは抽象データ型(あるいはインタフェース)。
    クラス間の「である」関係は、 OOP では継承として表現される。
    OOP と三元論の対応から、三元論でも同様に内容と使用に基づく「である」「する」の関係構造が考えられる。
    本書では二元論はモデル内に内容しかないので、「である」に基づく関係のみが考えられる。
    「である」「する」の対比が現れるのは、視点がモデルの内外にあるかの違いと考えられる。
    パースは三元論の中でも内容が使用に先立って存在する視点を取っていると見られる。
    ハイデッガーの「手元にある」(zuhanden)と「手前にある」(vorhanden)は「する」と「である」との対応が考えられ、使用が内容に先立つ視点を取っていると見られる。
    内容・使用との対応を考えると、 再帰的な記号では「である」「する」の対比は消滅する。しかし人間の記号においては峻別が簡単でないからこそどちらの関係構造を採択するかが問題となる。その顕著な例がプログラミング。
    以上が「である」「する」と三元論の対応の話。ちょっともやる。
    「する」を導入する目的は再利用や複雑性の低減だけではなかろうし、FPにも abstract data type のような「する」に基づく抽象がある。「FP = 二元論、 OOP = 三元論」をここへ適用することで単純化が強くなっている印象。
- date: 2026-08-23
  bookTitle: 記号と再帰 新装版 記号論の形式・プログラムの必然
  pages: 107 ~ 119
  notes: |
    第 6 章。表現レベル。情報記号では識別子が指すものが型・アドレス・値と抽象レベルが異なる。
    例えば、代入演算子の左右で抽象レベルが左辺はアドレスで右辺は値で異なる、多くの OOP でのコンストラクタがクラスと識別子を同じくする、等。
    情報記号の曖昧性の解消は、文脈中でどのような識別子が使われるかに依り実用論的に行われる。それは例えば命令や演算子による。他にも値型と参照型の違いもある。
    この指示の曖昧性≒複数の表現レベルは記号論では記号の分類として扱われる問題。
    記号の種類は、二元論ではイェルムスレウがソシュールの思想を拡張して、三元論ではパース自身が形式化して行っている。
    二元論と三元論の記号モデルの対応付けの仮説を踏まえ、情報記号に二元論・三元論の分類の適用を試みる。
