  notes: |
    第 7 章。内容の種類についてパースの普遍的範疇で分類。パースは項を様々に関係させるには三項関係で充足すると考えた。
    すべての項は三種類の項に集約される、と考えたのはパースだけでなく、ロックやヘーゲルの弁証法でも見られる。パースの普遍的範疇の説明はあまり厳密といえるものではないと考えられるため、関数型言語におけるチャーチの変換とカリー化による分解を通して三次性の本質に迫る。
    カリー化で多引数関数の適用が一引数関数の多数回適用に分解される。チャーチの変換で再帰関数が不動点関数とそれ以外の非再帰部分に分解される。カリー化とチャーチの変換はプログラムの表示的意味を保つ変換。
    再帰的な定義に対しては単純にカリー化できないため、先ずチャーチの変換で再帰的定義を不動点関数に押し込め、それ以外はカリー化する。
    そうして変換した結果の普遍的範疇をみると、一引数関数の適用 `f x` における単項 `x` が一次性、非再帰の一引数関数が二次性、不動点関数が三次性となる。三次性であるもの以外は二次性以下に分割できた。再帰に三次性の本質があると考えられる。これは記号の投機性とも関係する。
    チューリング完全で知られる SKI コンビネータは項関係から普遍的範疇との関係が暗示されるが、普遍的範疇とコンビネータ理論の関係は明らかでなく、今後の課題。
    パースは類似・指標・象徴より精緻な記号の分類方法を提案しており、次性の組合せで 10 種類の記号があるとするが、本章で取り扱った変換の結果がその内のどれに当たるかは、正当性を確かめようもなく得るものもないので考察を止める。
    はじめチャーチの変換って言葉がよくわからんかったが不動点コンビネータを使うって話だった。次性と変換結果の対応まではわかったがその後のコンビネータ理論とパースの分類方法のところは結論がなくふわっとしてわからなかった。
