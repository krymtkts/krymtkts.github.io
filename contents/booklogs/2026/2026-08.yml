- date: 2026-08-09
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 154 ~ 166
  notes: |
    8 章。言語の例として記譜法。楽譜は文でアルゴリズムの記述。演奏が計算で音楽家が計算機。
    ギターのタブラチュア譜は五線譜よりより具象的で、五線譜は音程が記号インデックス的である点も含め恣意的な構文。
    文法規則。終端記号と非終端記号。終端記号は変わらない意味を持ち、非終端記号は異なる値を取りうる。
    文法はいくつかの規則で構成される。例えば非終端記号を終端記号に置き換える命令。
    置き換えたあとも非終端記号が含まれる場合は文形式という。置き換えた非終端記号自身を含み終端しない文形式は再帰的であるという。
    異なる言語の間での翻訳は抽象構文という中間表現を解することでうまくいく。抽象構文は文の構造を表し、具象構文は文の外見を表す。抽象構文は抽象構文機で構成される。
    逆に具象構文から抽象構文を導くのは解析木を解する。
    文を開始シンボルから解析する戦略はトップダウン解析、逆に規則の右辺から単一のルートを求めるのはボトムアップ解析。
    構文木から具象構文に変換する仮定はプリティプリントと呼ばれる。
    タブ譜の音符の長さが曖昧ってのはなんか違うような。大抵五線譜式の規則が導入されてるし。でも併記されてるしそういう側面はあるのかも。
    その点に注目したことがなかった程度には五線譜やタブ譜の構文木を意識したことなかったので観点としては気づきを得たかもな。
- date: 2026-08-10
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 167 ~ 180
  notes: |
    薬局からの折り返し電話 ~ 9 章。言語の意味が抽象構文を作る。文が 2 つ以上の意味を持つとき、それを曖昧であるという。
    単語や記号が曖昧になりうるのを語彙的曖昧性(多義性)、文中の組み合わせであいまいになりうるのを文法的曖昧性(構造的曖昧性)と呼ぶ。
    曖昧さは非決定性とは違う。非決定性は言語の機能で、曖昧さは言語の構文定義のバグ。
    言語の表す意味については意味論(semantics)、その個々の文については意味(meaning)。その言語が示す意味すべてを集めたのが意味領域。
    抽象構文が何を示す(表示する)かで意味づけするかを示すのが表示的意味論。
    非終端記号の規則に基づく変換は、文の意味が抽象構文を介しシステマティックに構築される様子を示す。この様に構文規則から体系的に決まることを合成的と呼ぶ。
    単純な楽譜は合成的だが、自然言語はたいてい非合成的。五線譜でもタイは小節をまたいで複数の小節をまとめて扱う規則で上書きする必要があるので非合成的。
    表示的意味論は言語から与えられた意味を計算するアルゴリズムと言える。その文の意味を計算できる計算機のことをインタプリタ(解釈器)と呼ぶ。
    表示的意味論で数学的対象云々が触れられてないからちょっと形式化とは距離がある浮いた感じがするな。別にわたしも理解してるわけじゃないけど。
- date: 2026-08-11
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 181 ~ 198
  notes: |
    習慣の力 ~ 10 章。言語が違えば意味論も違うが、直接効果をもたらす操作、操作の順序・適用・繰り返しを体系化数制御構造という 2 つの命令で構成されるという性質は共有している。
    ループはあるまとまった行動を何回か繰り返すこと。繰り返す行動はループの本体と呼ばれ、ループの本体を実行吸うことはループの反復と呼ばれる。
    ループの本体は反復ごとに同じであり、変化が必要な場合は変数により実現される。
    ループを抜け出す条件は終了条件と呼ばれ、それにより終了するループと終了しないループを区別できる。
    ループは制御構造の 1 つ。他の主要な制御構造は、ステップのまとまりを一連の順序あるステップにまとめる逐次合成、複数のステップから条件に合う 1 つを選ぶ条件分岐がある。
    制御構造を示す記法としてフローチャートがある。フローチャートは視覚言語である。
    ループには repeat ループ、 while ループ、 for ループがある。
    while ループは継続する条件を満たす限りループを続けるため、条件が成り立たなければ全く実行されないこともある。
    for ループは反復回数が決まっている場合に使われる。 for ループは終了が保証されているが repeat ループと while ループは終了が保証されず永遠に動き続ける可能性がある。
    なんとなく、記号論や意味論を概要に留めて説明を踏み込んでないから本書で読み解くのが難しいのであって、制御構造のようなそこまで抽象的でないテーマは読み解くのは容易いのかもしれんな。
- date: 2026-08-12
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 199 ~ 214
  notes: |
    何もないところで止まる ~ 11 章。停止性問題。
    ループは変数を介して世界≒状態にアクセスして終了条件を満たしループを終えるか決める。
    ループの命令列を作り出すことを展開という。
    ループが終ることを分析するアルゴリズムは作れない。停止性問題の非可解性。
    はい・いいえで答えられる問題は決定問題とよばれ、決定可能・決定不能に分かれる。
    入力に対する出力を問うのは関数問題、アルゴリズムで解けない問題は計算不能・計算可能に分けられる。
    決定可能な問題の数は可算、決定不能な問題の数は非可算。可算無限と非可算無限。
    難しいのもそうでないのも分け隔てなく広く取り扱ってるからの独特のリズム感がこの本はあるなとようやくわかってきたわ。
- date: 2026-08-13
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 215 ~ 238
  notes: |
    これをもう一度読みなさい ~ 12 章。
    再帰。自己相似性と自己参照という特性を持つ。
    再帰とループはいずれも書き換えが可能な点は同じだが、データ定義にも使える点で再帰のほうが基礎的な特性を持つ。
    再帰の終了条件は残りの要素がなくなった時。そのような要素のデータ構造での条件分岐はパターンマッチと呼ばれる。
    再帰における不動点とは、変数を適用しても結果がもとと同一になる点。定義上同一とみなせる点。
    再帰にはたくさんの分類がある。記述された再帰は再帰のアルゴリズム定義自体、展開された再帰は実行時に再帰構造に展開された計算。
    有限の再帰と無限の再帰。再帰の中で再帰を引き起こさない点は既定と呼ばれ、有限の再帰に含まれる。
    直接的な再帰と間接的な再帰では、直接的に自己参照するかという違いがある。
    他にも、生成的再帰・構造的再帰、線形再帰、非線形再帰という区別もある。
    図にビルって書いてるけどビフの誤記。広く浅くだとこうなるのかなとは思うが、本書で触れてる停止性や計算量に絡んでないのがちょっと物足りない気がした。
    次に読むのは記号と再帰の本にしたいなという気が仕上がってきた。
- date: 2026-08-14
  bookTitle: ワンス・アポン・アン・アルゴリズム 物語で読み解く計算
  pages: 239 ~ 256
  notes: |
    最新作 ~ 13 章。
    再帰的なアルゴリズムの実行について。置換(書き換え)により再帰的な定義からトレースを組み立てる。
    置換は局所的に行われるため全体の文脈は変わらない。
    計算のトレースは基本的に中間結果や状態の一連のスナップショット。
    インタプリタはアルゴリズムの実行時のスタックやコピーされた引数を追跡する。
    再帰では呼び出し元に戻って計算を続ける必要があり、各バージョンの情報で管理するのにスタックが向く。
    引数の値をパターンマッチで使われているパラメータの名前に関連付けるのを束縛という。
    再帰の定義の中で一度だけ自己言及するのを線形再帰、複数回自己言及するのを非線形再帰と呼ぶ。
    複数の自己言及があるからといって、計算機はそれらを並列に実行してもしなくてもよい。
    理論の前にプログラミングで再帰に触れてる分、言葉を覚える的な流れ作業チックになってしまうよな。やる気の問題かも知れんが。
