- date: 2026-08-01
  bookTitle: ワンス・アポン・ア・アルゴリズム 物語で読み解く計算
  pages: 30 ~ 46
  notes: |
    2 章。計算の動的な側面。パラメータがアルゴリズムに柔軟さをもたらす。アルゴリズムの違いは実行時間や実行に必要なリソースに影響を与え、アルゴリズムの複雑性・正確性・効率性といった指標で測れる。
    汎用計算機と特定のアルゴリズム一式を実行する計算機。計算を実行するもの＝計算機がアルゴリズムを記述した言語を読める必要があり、また実行の主体になれる必要がある。
    アルゴリズムの空間複雑性は、計算が成功するか、必要な資源が足りているか判断する指標となる。時間効率と空間効率。
    この本以前にコレだけヘンゼルのポケットのサイズだとか石の数だとかを真面目に考えた本は中々ないんじゃないかな。ここまで来ると笑える。
    子供の足で行ける範囲と考えるとそう遠くなかろうけど、連れ出された先が遠いと仮定したら、さぞかしヘンゼルのポケットが大きく石が小さかったんだろうなと言うのが想像できてコレまた笑える。
    なんでそんなにポケットパンパンで親にバレないんだよ。
    物語をベースにというか、物語はただ利用されてるだけで、殆どは思考実験じゃないかなこの本。中々難しい。
    創作の物語にこのシステムの観点を持ち込んだことはなかったので、個人的には新鮮だ。これからの読書生活に影響及ぼすぞコレ。
- date: 2026-08-02
  bookTitle: ワンス・アポン・ア・アルゴリズム 物語で読み解く計算
  pages: 47 ~ 50
  notes: |
    3 章。記号を解釈して意味を導くのは計算である。意味はアルゴリズムであり導かれた意味は計算である。
    記号をシステマティックに変換して別の記号に変換するのも計算。
    きょうは家の事情で忙し過ぎ＆疲労困憊て全然読めなかった。この書き出しだけでも相当メタな話なので、念入りに読むため MP 不足のきょうはここで終える。
