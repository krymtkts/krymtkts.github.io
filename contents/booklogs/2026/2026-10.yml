- date: 2026-10-01
  bookTitle: レガシーコードからの脱却 ソフトウェアの寿命を延ばし価値を高める 9 つのプラクティス
  pages: 221 ~ 240
  notes: |
    第 13 章。レガシーコードのリファクタリングについて。
    変更が必要なレガシーコードを保守せず、技術的負債を抱えると、開発コストの増加という利子を払うことになる。資産への投資として定期的な保守が必要。
    リファクタリングのテクニック。ピンニングテスト、依存性の注入、ストラングラーパターン、抽象化によるブランチなど。あとリファクタリングは勉強になって良いぞという話。
    個人的な感覚でも、保守もひっくるめた開発が一番難しくて面白い。リファクタリングだけが保守じゃないから、もっと広い意味での保守してくのが大事だと思う。
    巷ではスタートアップであることを理由に保守が放置気味なことも普通にあるが、短期的な合理性と、中長期的に見た先送り・問題回避のトレードオフやな。
    ランウェイが尽きるかも知れないときに保守とか言ってられるかというのはあると思うが、ランウェイが伸びてもサービスが死んだら意味がない。
    保守を放置して熟成が進むほど課題の解決も段違いに難しくなるし、結局は適切に保守せざるを得ない。
- date: 2026-10-02
  bookTitle: レガシーコードからの脱却 ソフトウェアの寿命を延ばし価値を高める 9 つのプラクティス
  pages: 241 ~ 271
  notes: |
    第 14 章。レガシーコードからの学び。プラクティスの実践と、その先にある原則の理解、そして変化の体現。
    きょうはアレルギーきつく話半分しか読めてないが、本書のプラクティスは、多分、制御可能性の確保がキーなんやろな。
    誰のための機能か宣言して目的に沿うよう制御、小さなサイズで制御可能な範囲で物を作る、TDD は検証可能性の制御、という具合に。
    この本質的な部分は AI が爆発的にコードを量産する時代でも変わらない。
    本書のプラクティスを実践し続け、その背景にある原則まで理解できれば、わたしが見出した制御可能性のような共通項を、その先に見るんやろな。
    本書はこれで終わり。わたし自身は本書から得るものなかったけど、自分の内省を促す程度には効果はあった。入門者には課題として本書を与えるくらいは良いかもな。
    ただ参考文献が 3 頁しかなくて薄いのが残念なので、本書を渡す入門者には他にもアジャイルに限らず古典を読むよう勧めたいところ。
