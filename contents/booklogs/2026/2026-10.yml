- date: 2026-10-01
  bookTitle: レガシーコードからの脱却 ソフトウェアの寿命を延ばし価値を高める 9 つのプラクティス
  pages: 221 ~ 240
  notes: |
    第 13 章。レガシーコードのリファクタリングについて。
    変更が必要なレガシーコードを保守せず、技術的負債を抱えると、開発コストの増加という利子を払うことになる。資産への投資として定期的な保守が必要。
    リファクタリングのテクニック。ピンニングテスト、依存性の注入、ストラングラーパターン、抽象化によるブランチなど。あとリファクタリングは勉強になって良いぞという話。
    個人的な感覚でも、保守もひっくるめた開発が一番難しくて面白い。リファクタリングだけが保守じゃないから、もっと広い意味での保守してくのが大事だと思う。
    巷ではスタートアップであることを理由に保守が放置気味なことも普通にあるが、短期的な合理性と、中長期的に見た先送り・問題回避のトレードオフやな。
    ランウェイが尽きるかも知れないときに保守とか言ってられるかというのはあると思うが、ランウェイが伸びてもサービスが死んだら意味がない。
    保守を放置して熟成が進むほど課題の解決も段違いに難しくなるし、結局は適切に保守せざるを得ない。
- date: 2026-10-02
  bookTitle: レガシーコードからの脱却 ソフトウェアの寿命を延ばし価値を高める 9 つのプラクティス
  pages: 241 ~ 271
  notes: |
    第 14 章。レガシーコードからの学び。プラクティスの実践と、その先にある原則の理解、そして変化の体現。
    きょうはアレルギーきつく話半分しか読めてないが、本書のプラクティスは、多分、制御可能性の確保がキーなんやろな。
    誰のための機能か宣言して目的に沿うよう制御、小さなサイズで制御可能な範囲で物を作る、TDD は検証可能性の制御、という具合に。
    この本質的な部分は AI が爆発的にコードを量産する時代でも変わらない。
    本書のプラクティスを実践し続け、その背景にある原則まで理解できれば、わたしが見出した制御可能性のような共通項を、その先に見るんやろな。
    本書はこれで終わり。わたし自身は本書から得るものなかったけど、自分の内省を促す程度には効果はあった。入門者には課題として本書を与えるくらいは良いかもな。
    ただ参考文献が 3 頁しかなくて薄いのが残念なので、本書を渡す入門者には他にもアジャイルに限らず古典を読むよう勧めたいところ。
- date: 2026-10-03
  bookTitle: 組織の壁を超える 「バウンダリー・スパニング」の 6 つの実践
  pages: 1 ~ 12
  notes: |
    目次、序文。 CCL(Center for Creative Leadership) の研究に基づいた縦割りの階層化組織ではなく、組織横断的なリーダーシップを発揮するためのプラクティスを紹介してるみたい。
    現代的な組織で境界を超える必要があることは TEAM OF TEAMS やメディチ・インパクトでも重要視されている点なので、それらの研究に基づいた補完を期待して読み始めた。
    わたし自身、開発組織内だけで見ても横断的に行動していることが自身の価値の一部なので、興味深く読んでいきたい。
- date: 2026-10-04
  bookTitle: 組織の壁を超える 「バウンダリー・スパニング」の 6 つの実践
  pages: 13 ~ 36
  notes: |
    はじめに ~ 序章。インターネット等コラボレーション技術の進歩が物理的境界を取り払う反面、人間関係の境界は今なおくっきりしている。それを橋渡しするのがリーダーの重要な仕事。
    本書で言う Boundary は、人々の活動を制限する障壁となる境界であり、同時に最先端の活動領域を指す。
    Boundary Spanning Leadership はその境界で活動するためのスキル。 Buffering(和らげること) Reflecting(映し返すこと) Connecting(つなげること) Mobilizing(結集させること) Weaving(織り合わせること) Transforming(変容させること)の 6 つの実践が必要。
    CCL(Center for Creative Leadership) の研究に基づいていて、リーダーシップを方向性(Direction)、団結力(Alignment)、責任感(Commitment)の 3 つの成果を出すものとする前提がある上で読む必要があるみたい。
    全体としては三部構成で、始めに分断させる力・分断がアイデンティティに起因することを学び、その後の各部でプラクティスに触れ、最後に境界を超えた協力がもたらす可能性や優れた成果であるネクサス効果に言及して終わる構成になっている。
    人間関係の境界の実例として、南アフリカのアパルトヘイトとその後の激変で人の方が変化出来ず溝となる話が触れられてて興味深い。
    メディチインパクト同様に接続地点に創造性が生まれることに言及されてるのが興味深いな。本書ではれをの連結点(ネクサス)と呼ぶ。
    メディチインパクトが概念の交差させることに注目していたのに対し、本書は人・組織を交差させることに注目するみたい。
    AI のススメで読むことにしたが、今のところ良い感触。
- date: 2026-10-05
  bookTitle: 組織の壁を超える 「バウンダリー・スパニング」の 6 つの実践
  pages: 37 ~ 63
  notes: |
    第 1 章。現代のリーダーが克服すべき境界とリーダーを取り巻く状況。
    階層間の垂直の境界・部門間の水平の境界・ステークホルダーとの境界・人口属性上の境界・地理的な境界。これらはリーダーシップの研究からも時代を超えた普遍的なものであることがわかっている。
    かつては垂直の境界が大きな分断の理由だったが、今では水平の境界、それについでステークホルダー・人口属性、・地理的境界が続く。
    最後に自分のネクサス課題(結びつきの課題ということだと思う)を明らかにするプラクティス。
    なんだか慣れない文でうまくまとめられなかった。人材開発とかエグゼクティブ教育って感じなのかな。
    無理やり自分の興味の範疇に当てはめると、 Principal Engineer のような組織横断・全社的な課題を扱うと、自分自身の中に複数の専門領域それぞれの要求や制約を同時に抱える。
    それを単一の専門領域だけでなく、複数の専門領域のバランスを取りながら解決しなければならないあたり、 boundary spanner(境界にまたがって活動する者)の価値でもあり悩みでもあるわけか。
- date: 2026-10-06
  bookTitle: 組織の壁を超える 「バウンダリー・スパニング」の 6 つの実践
  pages: 64 ~ 80
  notes: |
    第 2 章。個人・集団のアイデンティティは、差異や独自性、統合や所属といった人間の根源的な欲求の微妙なバランスから作られる。
    その「自分は何者か」という自己規定が、人間関係における最も強力で手強い境界であり、境界のリーダーシップでも中心的な問題。
    属性の重要度、支配性・非支配性。アイデンティティは組織間にグレート・ディバイドを生む。ジェーン・エリオットの実験で、実質的な差異がなくても境界が生み出せることがわかった。
    内集団へはハロー効果といったバイアスの影響もある。5 つの境界それぞれに、アイデンティティの異なりにより分断が起こる。
    ヒトは内集団にいると自分のアイデンティティに無自覚であり、自分が外集団にいたときの気持ちをすぐ忘れてしまう。
    同じ様に多くリーダー自身も境界の中心にあるアイデンティティの問題を認識できない。そこがアイデンティティを知ることの重要性につながる。
    青い目・茶色いの実験でアイデンティティによる分断が示されたのはすごいが、明らかに倫理的な問題をはらんでて時代を感じさせる。
    この内集団/外集団というのは重要なキーワードっぽいな。アイデンティティに無自覚であるというのは自戒としても覚えておきたい。
- date: 2026-10-07
  bookTitle: 組織の壁を超える 「バウンダリー・スパニング」の 6 つの実践
  pages: 81 ~ 106
  notes: |
    第 3 章。グレート・ディバイド。ロバーズ・ケーブ実験での接触仮説が当初機能しなかったのは、フォルトライン、1 つまたは複数の特徴に基づいて集団を下位集団に分断する仮想の境界線、が活性化したから。
    表面化していないフォルトラインは、地殻プレートのように断絶・摩擦・潜行・衝突をトリガーに活性化する。
    集団間の待遇の差は断絶を生む。別の集団への侮蔑や怒りは摩擦を生む。ある集団に別の集団への同調を求めると潜行を生む。集団間で正反対の意見や価値観を持ち意見を変えずぶつかったとき衝突を生む。
    こんなときリーダーが行動できないのは、事態の悪化を恐れ問題を認めない、時間が解決すると考えている、初めは小さな不平等である、単にどうしていいかわからない、といった理由。
    そんな状態でも、ロバーズ・ケーブ実験で示されたように問題解決・共通の目標達成のために連携することで、ネクサス効果の条件を整えることはできる。
    文化のギャップですれ違いが生じるのは異文化理解力で読んだ通り。
    ただそれより集団のアイデンティティがすぐ形成され、内集団・外集団でポジティブ・ネガティブな反応をすぐ示すのが難しいところやな。
- date: 2026-10-08
  bookTitle: 組織の壁を超える 「バウンダリー・スパニング」の 6 つの実践
  pages: 107 ~ 131
  notes: |
    Part 2 。バウンダリー・スパニング・リーダーシップの 6 つの実践は、相互に関連する、境界のマネジメント・共通の土台作り・新たなフロンティアの発見、の戦略に基づく。
    境界のマネジメントには、バッファリングとリフレクティングがある。
    バッファリングは、アイデンティティが持つ統合・所属に対する欲求と独自性に対する欲求のうち後者を利用し、境界を創出・強化することで集団に安心感をもたらす。
    リフレクティングは、集団間の違いを映し出し、知識や経験を共有して互いの敬意を深める。
    第 4 章。バッファリング。境界のマネジメントを可能にする実践。ここでのネクサス課題は境界を壊すより管理すること。
    境界を定めることをバウンダリーワークといい、ある集団が脅威を感じた時、境界を定めて情報や資源のフローを監視・保護し、集団の安全と安定を確保する。
    バッファリングの戦術はいくつかある。集団を分ける。外部からの脅威を減らす。境界が目に見えるようにする。統一のチームアイデンティティをつくる。チームの一体感を築く。
    脅威を感じるのは、大抵は集団への意図的な攻撃でなく、組織の中の避けられない変化。それは喪失感を伴うもので、喪失感を和らげ脅威を減じるための施策が必要となる。
    ただし、ある集団を支援するため行動が別の集団の緊張を高めることもある。リーダーシップトレードオフという。
    まるで喧嘩してる子供を引き離すようやな。でも本質的に同じっぽいな。しかしビジネスでこれをやろうとすると、中々に難しいなこれは。ただあえて境界を定めることの意味は理解した。
- date: 2026-10-09
  bookTitle: 組織の壁を超える 「バウンダリー・スパニング」の 6 つの実践
  pages: 132 ~ 154
  notes: |
    第 5 章。リフレクティング。境界の両方に目を向け、他の集団にも同じことをさせてみて、互いの相違点・共通点を理解し尊重する。
    これは同時に境界を明確にすることでもある。リフレクティングは共通の土台を築く前に踏むべき基本的ステップ。
    集団同士がそれぞれの願望・不安・関心事などを共有し、差異を受け入れて初めて、問題解決に向けて協業の手段を見出すことができる。
    リフレクティングの戦術。集団がお互いのことを知る機会をつくる。対立をもたらす要因となりやすい価値観・認識・感情の根本原因を明らかにする探求を誘う、安易な答えを許さない、激しい情熱を引き起こす問いを発する。
    違いを掘り下げ理解してその下に隠れた共通点を浮かび上がらせる。集団が 相手の集団を自分の集団に引き入れようとする傾向に抗う。スピードアップのためにあえてスピードダウンして集団に学習・知識交換・視点取得の機会をつくる。
    ここでのリーダーの役割は、相手集団の代弁者として鏡のように集団に伝えること。
    ただし、リーダー自身が集団に属すケースが否応なくあり集団に一員とみなされ公平なアウトサイダー(恐らく部外者)として見られない点が落とし穴。この場合は公平とみなされる別のリーダーを立てるなどの工夫が必要となる。
    本書の実践の紹介パターンは理解した。そしてこれまた難しい実践だ。実践とは言うが所謂方法論的な固定化されたプラクティスを提供しないのは大変ではあるがある意味誠実やな。
