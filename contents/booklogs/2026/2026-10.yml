- date: 2026-10-01
  bookTitle: レガシーコードからの脱却 ソフトウェアの寿命を延ばし価値を高める 9 つのプラクティス
  pages: 221 ~ 240
  notes: |
    第 13 章。レガシーコードのリファクタリングについて。
    変更が必要なレガシーコードを保守せず、技術的負債を抱えると、開発コストの増加という利子を払うことになる。資産への投資として定期的な保守が必要。
    リファクタリングのテクニック。ピンニングテスト、依存性の注入、ストラングラーパターン、抽象化によるブランチなど。あとリファクタリングは勉強になって良いぞという話。
    個人的な感覚でも、保守もひっくるめた開発が一番難しくて面白い。リファクタリングだけが保守じゃないから、もっと広い意味での保守してくのが大事だと思う。
    巷ではスタートアップであることを理由に保守が放置気味なことも普通にあるが、短期的な合理性と、中長期的に見た先送り・問題回避のトレードオフやな。
    ランウェイが尽きるかも知れないときに保守とか言ってられるかというのはあると思うが、ランウェイが伸びてもサービスが死んだら意味がない。
    保守を放置して熟成が進むほど課題の解決も段違いに難しくなるし、結局は適切に保守せざるを得ない。
- date: 2026-10-02
  bookTitle: レガシーコードからの脱却 ソフトウェアの寿命を延ばし価値を高める 9 つのプラクティス
  pages: 241 ~ 271
  notes: |
    第 14 章。レガシーコードからの学び。プラクティスの実践と、その先にある原則の理解、そして変化の体現。
    きょうはアレルギーきつく話半分しか読めてないが、本書のプラクティスは、多分、制御可能性の確保がキーなんやろな。
    誰のための機能か宣言して目的に沿うよう制御、小さなサイズで制御可能な範囲で物を作る、TDD は検証可能性の制御、という具合に。
    この本質的な部分は AI が爆発的にコードを量産する時代でも変わらない。
    本書のプラクティスを実践し続け、その背景にある原則まで理解できれば、わたしが見出した制御可能性のような共通項を、その先に見るんやろな。
    本書はこれで終わり。わたし自身は本書から得るものなかったけど、自分の内省を促す程度には効果はあった。入門者には課題として本書を与えるくらいは良いかもな。
    ただ参考文献が 3 頁しかなくて薄いのが残念なので、本書を渡す入門者には他にもアジャイルに限らず古典を読むよう勧めたいところ。
- date: 2026-10-03
  bookTitle: 組織の壁を超える 「バウンダリー・スパニング」の 6 つの実践
  pages: 1 ~ 12
  notes: |
    目次、序文。 CCL(Center for Creative Leadership) の研究に基づいた縦割りの階層化組織ではなく、組織横断的なリーダーシップを発揮するためのプラクティスを紹介してるみたい。
    現代的な組織で境界を超える必要があることは TEAM OF TEAMS やメディチ・インパクトでも重要視されている点なので、それらの研究に基づいた補完を期待して読み始めた。
    わたし自身、開発組織内だけで見ても横断的に行動していることが自身の価値の一部なので、興味深く読んでいきたい。
- date: 2026-10-04
  bookTitle: 組織の壁を超える 「バウンダリー・スパニング」の 6 つの実践
  pages: 13 ~ 36
  notes: |
    はじめに ~ 序章。インターネット等コラボレーション技術の進歩が物理的境界を取り払う反面、人間関係の境界は今なおくっきりしている。それを橋渡しするのがリーダーの重要な仕事。
    本書で言う Boundary は、人々の活動を制限する障壁となる境界であり、同時に最先端の活動領域を指す。
    Boundary Spanning Leadership はその境界で活動するためのスキル。 Buffering(和らげること) Reflecting(映し返すこと) Connecting(つなげること) Mobilizing(結集させること) Weaving(織り合わせること) Transforming(変容させること)の 6 つの実践が必要。
    CCL(Center for Creative Leadership) の研究に基づいていて、リーダーシップを方向性(Direction)、団結力(Alignment)、責任感(Commitment)の 3 つの成果を出すものとする前提がある上で読む必要があるみたい。
    全体としては三部構成で、始めに分断させる力・分断がアイデンティティに起因することを学び、その後の各部でプラクティスに触れ、最後に境界を超えた協力がもたらす可能性や優れた成果であるネクサス効果に言及して終わる構成になっている。
    人間関係の境界の実例として、南アフリカのアパルトヘイトとその後の激変で人の方が変化出来ず溝となる話が触れられてて興味深い。
    メディチインパクト同様に接続地点に創造性が生まれることに言及されてるのが興味深いな。本書ではれをの連結点(ネクサス)と呼ぶ。
    メディチインパクトが概念の交差させることに注目していたのに対し、本書は人・組織を交差させることに注目するみたい。
    AI のススメで読むことにしたが、今のところ良い感触。
- date: 2026-10-05
  bookTitle: 組織の壁を超える 「バウンダリー・スパニング」の 6 つの実践
  pages: 37 ~ 63
  notes: |
    第 1 章。現代のリーダーが克服すべき境界とリーダーを取り巻く状況。
    階層間の垂直の境界・部門間の水平の境界・ステークホルダーとの境界・人口属性上の境界・地理的な境界。これらはリーダーシップの研究からも時代を超えた普遍的なものであることがわかっている。
    かつては垂直の境界が大きな分断の理由だったが、今では水平の境界、それについでステークホルダー・人口属性、・地理的境界が続く。
    最後に自分のネクサス課題(結びつきの課題ということだと思う)を明らかにするプラクティス。
    なんだか慣れない文でうまくまとめられなかった。人材開発とかエグゼクティブ教育って感じなのかな。
    無理やり自分の興味の範疇に当てはめると、 Principal Engineer のような組織横断・全社的な課題を扱うと、自分自身の中に複数の専門領域それぞれの要求や制約を同時に抱える。
    それを単一の専門領域だけでなく、複数の専門領域のバランスを取りながら解決しなければならないあたり、 boundary spanner(境界にまたがって活動する者)の価値でもあり悩みでもあるわけか。
